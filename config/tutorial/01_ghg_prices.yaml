# Tutorial 1 — GHG price sweep at a fixed (baseline) diet
# -------------------------------------------------------
# Three scenarios that share an identical, observed baseline diet and differ
# only in the carbon price applied to the objective. Because consumption is
# fixed, any differences between scenarios come entirely from how production,
# trade, and land use reorganise under a rising GHG cost.
#
# See docs/tutorial.rst (Part 1) for a walkthrough.

name: "tutorial_01"

# The health module stays off (the default), so this tutorial needs no
# manually-downloaded IHME GBD data; see docs/health.rst to switch it on.

# Tutorials knowingly reuse the default calibration artefacts at a coarser
# regional resolution.
calibration:
  accept_provenance_mismatch: true

# Reduced spatial resolution so the tutorial completes in a few minutes on a
# laptop after the one-off data download. 200 is the smallest value the
# default country list admits without enabling cross-border clustering.
aggregation:
  regions:
    target_count: 200

scenarios:
  # No carbon price. All scenarios below share enforce_baseline_diet=true, so
  # consumption is held at the observed 2020 diet and only production shifts.
  baseline:
    validation:
      enforce_baseline_diet: true
    emissions:
      ghg_price: 0

  ghg_mid:
    validation:
      enforce_baseline_diet: true
    emissions:
      ghg_price: 50

  ghg_high:
    validation:
      enforce_baseline_diet: true
    emissions:
      ghg_price: 200

# Compare all three scenarios in auto-generated plots.
plotting:
  comparison_scenarios: "all"

# This config's build differs structurally from the default, so the default
# set's link-keyed market-response intercepts do not apply; production
# anchoring stays with the L1 deviation penalty.
market_response:
  enabled: false
# Keep the legacy calibrated corrections with the L1 anchor for this reduced
# structural config; PMP and cost calibration are mutually exclusive.
cost_calibration:
  enabled: true
deviation_penalty:
  enabled: true
