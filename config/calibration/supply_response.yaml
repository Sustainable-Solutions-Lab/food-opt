# Supply-response intercept calibration (PMP phase 1)
# ---------------------------------------------------
# One solve with every supply-curve group pinned to its observed activity
# behind an elastic pin; the duals of the pinning constraints are the
# per-group price wedges, written as curve intercepts to
# data/curated/calibration/<source>/supply_response.csv.
#
# Usage:
#   tools/calibrate supply_response

# ``tools/calibrate`` overrides this with a source- and step-specific name so
# another calibration config cannot overwrite this step's intermediates.
name: "calibration"

# The wedges are fit under the base config's own operating regime with the
# policy dials at neutral: production pinned, demand left to whatever drives
# it in ordinary solves, no GHG price. Exact baseline reproduction then holds
# for unpriced solves of the same config, and a priced solve shows the pure
# elasticity-governed response. Enforcing the baseline diet here instead would
# fit the wedges against a demand system ordinary solves do not have.
emissions:
  ghg_pricing_enabled: false

# NB: diet.anchor_groups_to_gbd is pinned to the base config's resolved value
# by tools/calibrate (via a config overlay), so disabling health here for
# solver performance does not change the baseline diet the artefacts are fit
# against.
health:
  enabled: false
  value_per_yll: 0

# The pinned solve measures wedges against the accounting costs alone: no
# other anchoring may run.
deviation_penalty:
  enabled: false

food_utility_piecewise:
  enabled: false

supply_response:
  enabled: true
  pin_baseline: true
  intercepts: null
  calibration:
    generate: true

solving:
  solver: gurobi
  io_api: "direct"
  threads: 4
  mem_mb: 9000
  runtime: 30
