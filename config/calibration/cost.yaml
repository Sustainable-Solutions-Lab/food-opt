# Cost Calibration Configuration
# -------------------------------
# Generates production cost calibration corrections for crops, grassland,
# and animals by:
#   1. Solving a baseline scenario (enforce_baseline_diet, hard production
#      stability at +/-5%) to absorb residual supply/demand mismatch
#   2. Solving a calibration scenario (enforce_baseline_diet, hard production
#      stability at +/-1%) → extracts duals as cost corrections
#
# Usage:
#   tools/calibrate cost
#
# Or equivalently:
#   tools/smk --configfile config/calibration/cost.yaml -- \
#     data/curated/calibration/crop_cost.csv \
#     data/curated/calibration/grassland_cost.csv \
#     data/curated/calibration/animal_cost.csv

# ``tools/calibrate`` overrides this with a source- and step-specific name so
# another calibration config cannot overwrite this step's intermediates.
name: "calibration"

scenarios:
  # Step 1: Baseline solve.
  #
  # Production stability is enabled with a +/-5 % band so that the food
  # p_set duals reflect the marginal cost of supply under realistic
  # (geographically pinned) production patterns, while leaving the LP
  # enough room to absorb residual FAOSTAT-vs-FBS mismatches that the
  # food-demand calibration could not close. The file-level
  # ``validation.slack_marginal_cost`` override ($7 500/t) caps the
  # remaining slack-driven duals at the upper end of realistic
  # wholesale prices. See docs/costs.rst.
  cost_baseline:
    validation:
      enforce_baseline_diet: true
    deviation_penalty:
      enabled: true
      penalty_mode: "hard"
      land:
        enabled: true
        crops:
          enabled: true
          max_relative_deviation: 0.05
          enable_slack: true
        grassland:
          enabled: true
          max_relative_deviation: 0.05
          enable_slack: true
        land_conversion:
          enabled: false
      feed:
        enabled: true
        max_relative_deviation: 0.05
        enable_slack: true
      diet:
        enabled: false

  # Step 2: Calibration solve with tight production stability. The diet stays
  # pinned to baseline (matching step 1), so the tight-band duals measure the
  # marginal cost of holding observed production under the observed diet.
  cost_calibration:
    validation:
      enforce_baseline_diet: true
    deviation_penalty:
      enabled: true
      penalty_mode: "hard"
      land:
        enabled: true
        crops:
          enabled: true
          max_relative_deviation: 0.01
          enable_slack: true
        grassland:
          enabled: true
          max_relative_deviation: 0.01
          enable_slack: true
        land_conversion:
          enabled: false
      feed:
        enabled: true
        max_relative_deviation: 0.01
        enable_slack: true
      diet:
        enabled: false

# Later-step calibration (lower-triangle rule): the market-response curves
# and their intercept artefact must not influence the cost duals.
market_response:
  enabled: false

cost_calibration:
  enabled: false     # Don't apply calibration (we're generating it)
  generate: true     # Generate calibration from solved model
  scenario: "cost_calibration"

validation:
  use_actual_yields: true
  # Cap slack-driven duals at the upper end of realistic food wholesale
  # prices. Bumped from 5.0 -> 7.5 ($7 500/t) to leave headroom for
  # high-value foods (beef, lamb, cheese, butter, olive-oil, nuts) whose
  # actual wholesale prices sit between $5 000 and $7 000/t. This same
  # parameter penalises production-stability slack (see step 2): a higher
  # cap lets cost corrections absorb a wider range of structural
  # mismatches in one shot, but masks underlying data errors if it goes
  # too high. See docs/costs.rst.
  slack_marginal_cost: 7.5

# NB: diet.anchor_groups_to_gbd is pinned to the base config's resolved value
# by tools/calibrate (via a config overlay), so disabling health here for
# solver performance does not change the baseline diet the artefacts are fit
# against.
health:
  enabled: false
  value_per_yll: 0

emissions:
  ghg_pricing_enabled: false

solving:
  solver: gurobi
  io_api: "direct"
  threads: 2
  mem_mb: 9000
  runtime: 20
