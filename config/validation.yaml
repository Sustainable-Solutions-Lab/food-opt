# Validation
# ----------
# Runs the model in validation mode (actual yields, enforced baseline diet
# and feed) to compare model behaviour against observed 2020 outcomes.
#
# Health stays off (the default): the goal here is physical mass balance, and
# leaving it off keeps the run clear of the manually-downloaded IHME GBD data
# and of GBD anchoring of the baseline diet.

name: "validation"

scenarios:
  default: {}

validation:
  use_actual_yields: true
  use_actual_production: true
  enforce_baseline_diet: true
  enforce_baseline_feed: true
  disable_spared_cropland: true
  disable_spared_grassland: true
  slack_marginal_cost: 10

deviation_penalty:
  enabled: false

cost_calibration:
  enabled: false

food_demand_calibration:
  enabled: false

emissions:
  ghg_pricing_enabled: false

solving:
  io_api: "direct"
  solver: "gurobi"
  threads: 2
