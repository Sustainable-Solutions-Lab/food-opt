# Water-carbon GSA (fixed diet)
# -----------------------------
# Space-filling Sobol sequence over the uncertain PHYSICAL parameters that drive
# the carbon side of the water-carbon result, with the study's two levers as
# continuous SLICE parameters so the fitted surrogate yields the emissions
# response to water pricing across the production-flexibility axis WITH
# parameter-uncertainty bands.
#
# Slice parameters (the response axes, evaluated via the surrogate):
#   - band:        0.05-1.0 uniform. Hard per-link relative-deviation band width
#                  for cropland, grassland and feed; the production-flexibility
#                  axis.
#   - water_price: 1e-4-1 log-uniform (USD/m3-world-eq). The water-scarcity
#                  shadow price; the surrogate gives d(emissions) between the
#                  near-zero baseline and a strong price.
# Sampled uncertain (the carbon/physics envelope, as in gsa.yaml):
#   - yield_factor 0.8-1.2; ch4/n2o/luc_factor normal-CI; fcr_factor 0.8-1.2;
#     flw_factor 0.7-1.3; reforest_fraction 0.05-1.0.
#
# Diet is fixed (enforce_baseline_diet); health disabled. The flexible-diet
# counterpart is water_gsa_flexible_diet.yaml.

name: "water_gsa_fixed_diet"

validation:
  enforce_baseline_diet: true

health:
  enabled: false

scenarios:
  default: {}

  _generators:
    - name: wgsa_{sample_id}
      mode: sensitivity
      samples: 256
      slice_parameters: [band, water_price]
      parameter_groups:
        "Emission factors": [ch4_factor, n2o_factor, luc_factor]
        "Agricultural": [yield_factor, flw_factor, fcr_factor]
        "Land use": [reforest_fraction]
      parameters:
        yield_factor:
          lower: 0.8
          upper: 1.2
          bounds: [0, null]
        ch4_factor:
          distribution: normal_ci
          lower: 0.5
          upper: 1.5
          confidence: 0.9
          bounds: [0, null]
        n2o_factor:
          distribution: normal_ci
          lower: 0.3
          upper: 1.7
          confidence: 0.9
          bounds: [0, null]
        luc_factor:
          distribution: normal_ci
          lower: 0.3
          upper: 1.7
          confidence: 0.9
          bounds: [0, null]
        flw_factor:
          lower: 0.7
          upper: 1.3
          bounds: [0, null]
        fcr_factor:
          lower: 0.8
          upper: 1.2
          bounds: [0, null]
        reforest_fraction:
          lower: 0.05
          upper: 1.0
          bounds: [0.05, 1]
        band:
          lower: 0.05
          upper: 1.0
        water_price:
          distribution: log_uniform
          lower: 0.0001
          upper: 1.0
      template:
        sensitivity:
          crop_yields:
            all: "{yield_factor}"
          emission_factors:
            ch4: "{ch4_factor}"
            n2o: "{n2o_factor}"
            luc: "{luc_factor}"
          food_loss_waste: "{flw_factor}"
          feed_conversion: "{fcr_factor}"
        land:
          reforestation_cap:
            max_fraction: "{reforest_fraction}"
        deviation_penalty:
          penalty_mode: hard
          deviation_type: relative
          land:
            crops:
              l1_cost: 0.0
              max_relative_deviation: "{band}"
              enable_slack: true
            grassland:
              l1_cost: 0.0
              max_relative_deviation: "{band}"
              enable_slack: true
          feed:
            l1_cost: 0.0
            max_relative_deviation: "{band}"
            enable_slack: true
        water_scarcity:
          pricing_enabled: true
          price: "{water_price}"
        emissions:
          ghg_pricing_enabled: false
          ghg_price: 0

# Surrogate-based sensitivity analysis.
sensitivity_analysis:
  holdout_fraction: 0.15
  threads: 6
  default_surrogate: xgb
  discover_scenarios_on_disk: true
  sobol:
    outputs: [co2, ch4, n2o, land_use, sequestration, scarcity, withdrawn]
  methods:
    xgb:
      method_options:
        n_estimators: 5000
        max_depth: 4
        learning_rate: 0.02
        subsample: 0.8
        colsample_bytree: 0.8
        min_child_weight: 5
        early_stopping_rounds: 50
  outputs:
    # Core emission / land targets (declared here rather than inherited from
    # default.yaml, which no longer ships a default output set).
    co2:
      source: net_emissions.parquet
      reducer: filter_sum
      filter_col: gas
      filter_value: co2
      value_col: mtco2eq
      label: "CO₂ Emissions"
      units: "MtCO₂eq"
    ch4:
      source: net_emissions.parquet
      reducer: filter_sum
      filter_col: gas
      filter_value: ch4
      value_col: mtco2eq
      label: "CH₄ Emissions"
      units: "MtCO₂eq"
    n2o:
      source: net_emissions.parquet
      reducer: filter_sum
      filter_col: gas
      filter_value: n2o
      value_col: mtco2eq
      label: "N₂O Emissions"
      units: "MtCO₂eq"
    land_use:
      source: land_use.parquet
      reducer: column_sum
      column: area_mha
      label: Land Use
      units: Mha
    sequestration:
      source: net_emissions.parquet
      reducer: filter_sum
      filter_col: source
      filter_value: "Carbon sequestration"
      value_col: mtco2eq
      label: Carbon sequestration
      units: "MtCO₂eq"
    scarcity:
      source: water_metrics.parquet
      reducer: column_sum
      column: scarcity_mm3_eq
      label: Water scarcity
      units: "Mm3 world-eq"
    withdrawn:
      source: water_metrics.parquet
      reducer: column_sum
      column: withdrawn_mm3
      label: Irrigation withdrawn
      units: "Mm3"

plotting:
  comparison_scenarios: "all"

solving:
  solver: "gurobi"
  io_api: "direct"
  threads: 2
  # Pure LP: dedicated barrier (timed 2026-07-08 on central water models;
  # sampled extremes untested -- revert to Method 3 + NumericFocus 2 if the
  # barrier stalls, cf. the rationale in gsa.yaml).
  options_gurobi:
    LogToConsole: 0
    OutputFlag: 1
    Method: 2
  mem_mb: 10000
  time_limit: 30
  runtime: 6
  inline_analysis: true
