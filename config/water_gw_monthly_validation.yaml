# Monthly-resolution groundwater validation (fixed baseline diet)
# ---------------------------------------------------------------
# Full production resolution (750 regions) with water.temporal_resolution: 12,
# so surface availability binds against crop water demand month by month in the
# LP. The baseline (fixed 2020 diet, ~baseline cropland, no groundwater cap or
# price) should reproduce approximately the current groundwater depletion
# endogenously; we validate the modelled mining against the WaterGAP 2.2e
# physical band (~155.7 km3/yr across 722 regions) both globally and per region.
#
# Same structural regime as water_groundwater_tradeoff_fixed_diet, but monthly
# temporal resolution and only the baseline scenario (that is all we need to
# read off the endogenous baseline draw).

name: "water_gw_monthly_validation"

water:
  temporal_resolution: 12
  supply:
    scarcity_tiers: true
    groundwater: true
# Fix diet to the 2020 baseline (production-side reorganization only).
validation:
  enforce_baseline_diet: true

health:
  enabled: false

solving:
  solver: "gurobi"
  mem_mb: 8000

# Paper default production-stability regime: hard per-link relative bands with
# expensive slack for feasibility.
deviation_penalty:
  penalty_mode: hard
  deviation_type: relative
  land:
    crops: {l1_cost: 0.0, max_relative_deviation: 0.05, enable_slack: true}
    grassland: {l1_cost: 0.0, max_relative_deviation: 0.05, enable_slack: true}
  feed: {l1_cost: 0.0, max_relative_deviation: 0.05, enable_slack: true}

scenarios:
  default:
    emissions: {ghg_pricing_enabled: false, ghg_price: 0}
    groundwater_depletion: {pricing_enabled: false, price: 0, cap_mm3: null}

# The water paper uses the FBS-derived baseline diet and its own calibration
# artefact set (fit against the FBS diet; regenerate with
# `tools/calibrate --base <this config>` after structural changes).
diet:
  source: fbs

food_demand_calibration:
  demand_headroom: 0.05

calibration:
  source: fbs-water
