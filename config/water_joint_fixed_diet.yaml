# Joint water + carbon pricing study (fixed diet)
# -----------------------------------------------
# Canonical config for the reframed water paper: the carbon cost of relieving
# agricultural water scarcity, and how simultaneously pricing carbon (at
# SCC-like levels) changes it. A deterministic (ghg_price x churn x
# water_price) cube at central physical parameters, regional churn cap with
# the SUITABLE-area denominator (the paper's default cap geometry), paired
# unpriced/priced along the water-price axis at every (ghg, churn) cell.
#
# Phase B central cube (2026-07-02): ghg {0, 50, 200} x churn {9 values,
# 0.01..1.0} x water price {0 (baseline) + 10 values, 0.003..3.0} = 297
# scenarios. Probe-cube points (churn {0.03,0.2,1.0} x wp {0.01,0.1,0.3,1,3})
# are a subset, solved fresh here under slack_marginal_cost=500.
# E4 densification (2026-07-03): 8 extra water prices {0.005, 0.02, 0.05,
# 0.07, 0.15, 0.25, 0.4, 0.7} interleaved into the priced generator (+216
# scenarios, cube now 513) to smooth the cost-wall region in the paper's
# Figs 2/3/5; same code state and settings as Phase B.
# Scenario names are FIXED-WIDTH (all equal length: j{ghg:03d}c{churn_pct:03d}
# w{price_milli:04d}) so no name is a prefix of another -- avoids the local
# Snakemake multi-target wildcard-ambiguity bug.
#
# All three swept knobs (emissions pricing, water pricing, deviation caps)
# are solve-time keys, so this reuses the existing fixed-diet build.

name: "water_joint_fixed_diet"

validation:
  enforce_baseline_diet: true
  # 50 (default) lets high water prices buy cap violations via slack in
  # extreme-scarcity basins (probe A2, 2026-07-01): relief at churn 3%,
  # wp=0.3 was 64% with slack-50 vs 8% real. 500 seals the cap through
  # wp=1; wp=3 retains a ~5-unit leak at tight caps (disclose/diagnose).
  slack_marginal_cost: 500.

health:
  enabled: false

deviation_penalty:
  penalty_mode: hard
  deviation_type: relative
  land:
    crops: {l1_cost: 0.0, max_relative_deviation: 0.2, enable_slack: true, scope: regional, regional_denominator: suitable}
    grassland: {l1_cost: 0.0, max_relative_deviation: 0.2, enable_slack: true, scope: regional, regional_denominator: suitable}
  feed: {l1_cost: 0.0, max_relative_deviation: 0.2, enable_slack: true, scope: regional, regional_denominator: baseline}

scenarios:
  default: {}
  _generators:
    # Baselines: water pricing off at each (ghg, churn) cell. The water-price
    # field is the literal "w0000" so all names share one fixed-width scheme.
    - name: j{ghg}c{churn}w0000
      mode: grid
      parameters:
        ghg: {values: [0, 50, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.01, 0.02, 0.03, 0.05, 0.1, 0.2, 0.35, 0.6, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", regional_denominator: suitable}
            grassland: {max_relative_deviation: "{churn}", regional_denominator: suitable}
          feed: {max_relative_deviation: "{churn}"}
        water_scarcity: {pricing_enabled: false, price: 0}
    # Water-priced arm: price encoded in milli-USD per m3 world-eq (4 digits).
    - name: j{ghg}c{churn}w{price}
      mode: grid
      parameters:
        ghg: {values: [0, 50, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.01, 0.02, 0.03, 0.05, 0.1, 0.2, 0.35, 0.6, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
        price: {values: [0.003, 0.005, 0.01, 0.02, 0.03, 0.05, 0.07, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.7, 1.0, 2.0, 3.0], name_format: "lambda x: f'{round(x * 1000):04d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", regional_denominator: suitable}
            grassland: {max_relative_deviation: "{churn}", regional_denominator: suitable}
          feed: {max_relative_deviation: "{churn}"}
        water_scarcity: {pricing_enabled: true, price: "{price}"}

    # --- B2 robustness geometries (SI), headline carbon prices only -------
    # Per-link bands (scope: per_link): p{ghg}c{band}w{price}; band relative
    # to each link's own baseline. Same fixed-width naming scheme.
    - name: p{ghg}c{churn}w0000
      mode: grid
      parameters:
        ghg: {values: [0, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.02, 0.05, 0.1, 0.2, 0.35, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", scope: per_link, regional_denominator: baseline}
            grassland: {max_relative_deviation: "{churn}", scope: per_link, regional_denominator: baseline}
          feed: {max_relative_deviation: "{churn}", scope: per_link}
        water_scarcity: {pricing_enabled: false, price: 0}
    - name: p{ghg}c{churn}w{price}
      mode: grid
      parameters:
        ghg: {values: [0, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.02, 0.05, 0.1, 0.2, 0.35, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
        price: {values: [0.01, 0.03, 0.1, 0.3, 1.0], name_format: "lambda x: f'{round(x * 1000):04d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", scope: per_link, regional_denominator: baseline}
            grassland: {max_relative_deviation: "{churn}", scope: per_link, regional_denominator: baseline}
          feed: {max_relative_deviation: "{churn}", scope: per_link}
        water_scarcity: {pricing_enabled: true, price: "{price}"}
    # Regional churn with the CURRENT (baseline) area denominator.
    - name: b{ghg}c{churn}w0000
      mode: grid
      parameters:
        ghg: {values: [0, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.02, 0.05, 0.1, 0.2, 0.35, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", regional_denominator: baseline}
            grassland: {max_relative_deviation: "{churn}", regional_denominator: baseline}
          feed: {max_relative_deviation: "{churn}"}
        water_scarcity: {pricing_enabled: false, price: 0}
    - name: b{ghg}c{churn}w{price}
      mode: grid
      parameters:
        ghg: {values: [0, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.02, 0.05, 0.1, 0.2, 0.35, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
        price: {values: [0.01, 0.03, 0.1, 0.3, 1.0], name_format: "lambda x: f'{round(x * 1000):04d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", regional_denominator: baseline}
            grassland: {max_relative_deviation: "{churn}", regional_denominator: baseline}
          feed: {max_relative_deviation: "{churn}"}
        water_scarcity: {pricing_enabled: true, price: "{price}"}
    # --- B4 reforestation sensitivity (SI): spared land may reforest at most
    # half its extent (reforestation_cap.max_fraction 1.0 -> 0.5).
    - name: r{ghg}c{churn}w0000
      mode: grid
      parameters:
        ghg: {values: [0, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.03, 0.2, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        land:
          reforestation_cap: {max_fraction: 0.5}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", regional_denominator: suitable}
            grassland: {max_relative_deviation: "{churn}", regional_denominator: suitable}
          feed: {max_relative_deviation: "{churn}"}
        water_scarcity: {pricing_enabled: false, price: 0}
    - name: r{ghg}c{churn}w{price}
      mode: grid
      parameters:
        ghg: {values: [0, 200], name_format: "lambda x: f'{int(x):03d}'"}
        churn: {values: [0.03, 0.2, 1.0], name_format: "lambda x: f'{round(x * 100):03d}'"}
        price: {values: [0.3, 1.0], name_format: "lambda x: f'{round(x * 1000):04d}'"}
      template:
        emissions: {ghg_pricing_enabled: true, ghg_price: "{ghg}"}
        land:
          reforestation_cap: {max_fraction: 0.5}
        deviation_penalty:
          land:
            crops: {max_relative_deviation: "{churn}", regional_denominator: suitable}
            grassland: {max_relative_deviation: "{churn}", regional_denominator: suitable}
          feed: {max_relative_deviation: "{churn}"}
        water_scarcity: {pricing_enabled: true, price: "{price}"}

solving:
  solver: "gurobi"
  io_api: "direct"
  threads: 2
  # Pure LP: dedicated barrier. Method 2 beats concurrent and NumericFocus 2
  # costs ~2x for identical objectives; timed 2026-07-08 incl. the capped
  # reforestation arm (see water_carbon_tradeoff_by_cap_fixed_diet.yaml).
  options_gurobi: {LogToConsole: 0, OutputFlag: 1, Method: 2}
  mem_mb: 4000 # measured peak ~3.3 GB/solve (750 regions, fixed diet)
  time_limit: 30
  runtime: 6
  inline_analysis: true

# Main's defaults run water at annual resolution with collapsed scarcity
# tiers; water studies need seasonal binding and the AWARE scarcity signal.
water:
  temporal_resolution: 4
  supply:
    scarcity_tiers: true
    groundwater: true

# The water paper uses the FBS-derived baseline diet and its own calibration
# artefact set (fit against the FBS diet; regenerate with
# `tools/calibrate --base <this config>` after structural changes).
diet:
  source: fbs

calibration:
  source: fbs-water
