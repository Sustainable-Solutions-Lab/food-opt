# Standalone validation configuration for documentation figures.
# Mirrors config/validation.yaml but writes to results/doc_validation/ so
# documentation runs don't clobber the main validation workspace. Keep the two
# files in sync.

name: "doc_validation"

scenarios:
  default: {}

validation:
  use_actual_yields: true
  use_actual_production: true
  enforce_baseline_diet: true
  enforce_baseline_feed: true
  disable_spared_cropland: true
  disable_spared_grassland: true
  slack_marginal_cost: 10

deviation_penalty:
  enabled: false

# Production is pinned via use_actual_production; the supply curves would
# double-anchor it and require an intercepts artefact this config never fits.
supply_response:
  enabled: false

cost_calibration:
  enabled: false

food_demand_calibration:
  enabled: false

emissions:
  ghg_pricing_enabled: false

solving:
  io_api: "direct"
  solver: "gurobi"
  threads: 2
