# Configuration for generating documentation figures.
#
# Everything not listed below falls back to config/default.yaml, so the figures
# show the model as a reader gets it out of the box. The overrides add the
# scenarios the figures need plus the health module, which three figures
# document.

name: "doc_figures"

scenarios:
  # Scenario definitions for documentation figures
  # -----------------------------------------------
  # The 'default' scenario mirrors config/scenarios.yaml so existing doc figure
  # rules (which hardcode scen-default) keep working unchanged.
  #
  # The 'baseline' scenario fixes consumption to current-day levels and is used
  # to extract consumer values (dual variables) for piecewise food utility
  # calibration.
  #
  # The GHG price scenarios sweep carbon prices from $0 to $500/tCO2-eq for the
  # landing-page production pattern GIF, showing how land use shifts under
  # increasing carbon pricing. All use piecewise food utility and calibrated
  # production market-response curves, matching the sensitivity setup.

  default: {}

  baseline:
    # Fixed consumption to extract consumer values (dual variables).
    # Mirrors the `baseline` scenario in config/gsa.yaml so that the
    # extracted values match what GSA scenarios calibrate against.
    validation:
      enforce_baseline_diet: true
    food_utility_piecewise:
      enabled: false
    emissions:
      ghg_price: 0
    health:
      value_per_yll: 0

  # --- GHG price scenarios for landing-page GIF ---
  # Round numbers on a roughly log scale from $0 to $500/tCO2-eq.
  ghg_0: &ghg_base
    food_utility_piecewise: {enabled: true}
    macronutrients: {cal: {equal_to_baseline: true}}
    health: {value_per_yll: 0}
    emissions: {ghg_price: 0}

  ghg_10:
    <<: *ghg_base
    emissions: {ghg_price: 10}

  ghg_50:
    <<: *ghg_base
    emissions: {ghg_price: 50}

  ghg_200:
    <<: *ghg_base
    emissions: {ghg_price: 200}

  ghg_500:
    <<: *ghg_base
    emissions: {ghg_price: 500}

# Enable piecewise utility at base level (blocks get built from baseline).
# The market_response demand component is its successor and must stay off
# alongside it.
food_utility_piecewise:
  enabled: true

market_response:
  components:
    demand: false

health:
  # Documentation figures include the health-cluster map, the diet-attributable
  # burden choropleth and the marginal-YLL bar chart, which need the health
  # data-prep outputs and health-aware solves. value_per_yll: 0 keeps health
  # out of the objective (post-hoc evaluation only). Needs the
  # manually-downloaded IHME GBD data.
  enabled: true
  value_per_yll: 0

# With health on, the baseline diet is GBD-anchored, so consume the artefact
# set calibrated against that diet (the `default` set is anchoring-off).
calibration:
  source: "gbd-anchored"

solving:
  solver: "gurobi"
